<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XG webtp2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="src/css/styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@300..700&display=swap" rel="stylesheet" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

    <script type="importmap">
      {
        "imports": {
          "animejs": "./node_modules/animejs/dist/bundles/anime.esm.min.js",
          "chart.js/auto": "./node_modules/chart.js/auto/auto.js",
          "@kurkle/color": "./node_modules/@kurkle/color/dist/color.esm.js",
          "typed.js": "./node_modules/typed.js/dist/typed.module.js",
          "vfx-js": "https://esm.sh/@vfx-js/core",
          "zzz": "https://esm.sh/zdog"
        }
      }
    </script>

    <script src="src/js/maplibre.js" type="module"></script>
    <script src="src/js/vfx.js" type="module"></script>
    <script src="src/js/typed.js" type="module"></script>
    <script src="src/js/tonejs.js" type="module"></script>
    <script src="src/js/animejs.js" type="module"></script>
    <script src="src/js/chartjs.js" type="module"></script>
    <script src="src/js/zdog.js" type="module"></script>
    <script src="src/js/bootstrap.js" defer></script>
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body>
    <div class="grid-container">
      <div class="grid-header">
        <p class="text1e"><span id="typedjs-elem3"></span></p>
      </div>
      <div class="grid-square">
        <div class="battery-casing">
          <div class="battery-cap"></div>
          <div class="battery-level"></div>
        </div>
        <canvas class="zdog-canvas"></canvas>
      </div>
      <div class="grid-text-long">
        <p><span id="typedjs-elem"></span></p>
      </div>
      <div class="grid-map"><div id="carte"></div></div>
      <div class="grid-gif-left"><img src="assets/img/xg GALA.gif" alt="GALA" class="gala img-fluid" /></div>
      <div class="grid-center-main">
        <p class="text2"><span id="typedjs-elem2"></span></p>
      </div>
      <div class="grid-text-right">
        <button class="btn btn-primary"><i class="bi bi-file-earmark-music"></i> Accessing..</button>
      </div>
      <div class="grid-gif-right"><img src="assets/img/XG GALA 2.gif" alt="xg lineup" class="XG img-fluid" /></div>
      <div class="grid-graphic">
        <div class="chart-container"><canvas id="a"></canvas></div>
      </div>
    </div>
  </body>
</html>
